name: Build KeePad
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - name: Check documentation impact
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$DOCS_BASE" ] && [ "$DOCS_BASE" != "0000000000000000000000000000000000000000" ]; then
            npm run docs:check -- --base "$DOCS_BASE"
          fi
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: KeePad-${{ matrix.os }}
          path: release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-screenshots-${{ matrix.os }}
          path: test-results/
